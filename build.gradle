plugins {
    id 'java'
}

allprojects {
    group = project.maven_group
    version = project.mod_version

    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        // the imgui bridge the amnetic editor draws through, dev only
        maven {
            name = 'ryanhcode'
            url = 'https://maven.ryanhcode.dev/releases'
            content {
                includeGroup 'foundry.imguimc'
            }
        }

        // release only, and content filtered because gradle otherwise asks it for every
        // artifact including minecraft, and one dns failure there fails the whole resolve
        maven {
            name = 'meekdev'
            url = 'https://maven.meekhasto.rest'
            content {
                includeGroup 'com.meekdev'
            }
        }
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.3'
    }
}

// DESIGN.md 5.2 / 19.4: module dependency rules are a build failure, not a convention.
// Implemented at M0; stub kept here so the task name exists from day one.
tasks.register('checkArchitecture') {
    group = 'verification'
    description = 'Fails on forbidden imports across module boundaries (DESIGN.md 5.2, 6.4).'
    doLast {
        logger.lifecycle('checkArchitecture: not implemented yet (M0)')
    }
}
