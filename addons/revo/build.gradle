def zig = findProperty('zig') ?: 'zig'
def nativeDir = file('native')
def nativeOut = layout.buildDirectory.dir('native')
def platform = 'linux-x86_64'

dependencies {
    compileOnly project(':core')
    compileOnly project(':script')
    testImplementation project(':core')
    testImplementation project(':script')
}

def revoCheckout = file("${rootDir}/../revo")
def patchedRevo = layout.buildDirectory.dir('revo-src')
def nativeSrc = layout.buildDirectory.dir('native-src')

tasks.register('patchRevo', Sync) {
    group = 'build'
    description = 'Copies revo next to the build and applies the embedding patch'
    from(revoCheckout) {
        exclude '.git/**', 'zig-out/**', '.zig-cache/**', 'zig-pkg/**'
    }
    into patchedRevo
    doFirst {
        if (!file("${revoCheckout}/build.zig").exists()) {
            throw new GradleException("the revo addon needs revo cloned next to this repo at ${revoCheckout}")
        }
    }
    doLast {
        def result = providers.exec {
            workingDir patchedRevo.get().asFile
            commandLine 'patch', '-p1', '--forward', '-i', file('native/revo-embedding.patch').absolutePath
            ignoreExitValue = true
        }
        if (result.result.get().exitValue != 0) {
            throw new GradleException("revo moved and the embedding patch no longer applies:\n" + result.standardOutput.asText.get())
        }
    }
}

tasks.register('prepareNative', Sync) {
    from(nativeDir) {
        exclude 'zig-out/**', '.zig-cache/**', 'zig-pkg/**', '*.patch'
    }
    into nativeSrc
    filesMatching('build.zig.zon') {
        filter { line -> line.replace('"../../../../revo"', '"../revo-src"') }
    }
}

tasks.register('buildNative', Exec) {
    group = 'build'
    description = 'Builds libmoudrevo from the patched revo copy'
    dependsOn 'patchRevo', 'prepareNative'
    workingDir nativeSrc
    inputs.dir(nativeDir)
    inputs.files(fileTree(revoCheckout) { include 'build.zig', 'build.zig.zon', 'src/**/*.zig' })
    outputs.dir(nativeOut)
    commandLine zig, 'build', '-Doptimize=ReleaseFast', '--prefix', nativeOut.get().asFile.absolutePath
}

processResources {
    dependsOn 'buildNative'
    from(nativeOut.map { it.dir('lib') }) {
        include '*.so'
        into "natives/${platform}"
    }
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(Test).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    dependsOn 'processResources'
}
