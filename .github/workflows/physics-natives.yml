name: physics-natives

on:
  push:
    branches: [main, rewrite]
    paths:
      - 'physics-natives/**'
      - '.github/workflows/physics-natives.yml'
  pull_request:
    paths:
      - 'physics-natives/**'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: librapier_moud.so
            resource_dir: linux-x64
          - label: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            lib: librapier_moud.so
            resource_dir: linux-arm64
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - label: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            lib: rapier_moud.dll
            resource_dir: windows-x64
          - label: macos-x64
            runner: macos-13
            target: x86_64-apple-darwin
            lib: librapier_moud.dylib
            resource_dir: macos-x64
          - label: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            lib: librapier_moud.dylib
            resource_dir: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install cross-linker (linux-arm64)
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: configure linker (linux-arm64)
        if: matrix.linker != ''
        run: |
          mkdir -p .cargo
          printf '[target.%s]\nlinker = "%s"\n' "${{ matrix.target }}" "${{ matrix.linker }}" > .cargo/config.toml
        working-directory: physics-natives

      - name: cargo build
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: physics-natives

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: physics-natives/target/${{ matrix.target }}/release/${{ matrix.lib }}
          if-no-files-found: error

  bundle:
    name: commit binaries
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: pull artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: stage binaries
        run: |
          set -eux
          stage() {
            local label="$1" lib="$2" dir="$3"
            install -Dm755 "artifacts/${label}/${lib}" \
              "physics-rapier/src/main/resources/natives/${dir}/${lib}"
          }
          stage linux-x64    librapier_moud.so   linux-x64
          stage linux-arm64  librapier_moud.so   linux-arm64
          stage windows-x64  rapier_moud.dll     windows-x64
          stage macos-x64    librapier_moud.dylib macos-x64
          stage macos-arm64  librapier_moud.dylib macos-arm64

      - name: commit if changed
        run: |
          set -eux
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add physics-rapier/src/main/resources/natives
          if git diff --cached --quiet; then
            echo "no native changes to commit"
            exit 0
          fi
          git commit -m "ci(physics-natives): rebuild rapier_moud binaries"
          git push
