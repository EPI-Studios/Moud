plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
}

import net.fabricmc.loom.task.RenderDocRunTask
import net.fabricmc.loom.task.RenderDocRunUITask
import java.util.Locale

def luauEnabled = providers.gradleProperty("moud.client.enableLuau")
        .map { it.toBoolean() }
        .orElse(true)
def luauVersion = providers.gradleProperty("moud.client.luauVersion")
        .orElse("1.0.0")
def clientJavaVersion = providers.gradleProperty("moud.client.java")
        .map { Integer.parseInt(it) }
        .orElse(25)

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }

    maven {
        name = "RedlanceMinecraft"
        url = "https://repo.redlance.org/public"
    }

    maven {
        url = 'https://repo.minestom.com/'
        content {
            includeGroup 'net.minestom'
            includeGroup 'com.miry'
        }
    }

    maven {
        name = 'BlameJared Maven (Veil)'
        url = 'https://maven.blamejared.com'
    }

    maven { url = 'https://maven.hollowcube.dev/releases' }

}



dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.18.6"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.10+1.21.1"
    compileOnly "javax.annotation:javax.annotation-api:1.3.2"

    include(modImplementation("foundry.veil:veil-fabric-1.21.1:3.3.3"))
    modImplementation "com.zigythebird.playeranim:PlayerAnimationLibFabric:1.1.4+mc.1.21.1"

    include implementation(project(':core'))
    include implementation(project(':net'))

    include implementation("com.github.stephengold:jolt-jni-Linux64:3.5.0")
    include runtimeOnly("com.github.stephengold:jolt-jni-Linux64:3.5.0:ReleaseSp")
    include runtimeOnly("com.github.stephengold:jolt-jni-Linux_ARM64:3.5.0:ReleaseSp")
    include runtimeOnly("com.github.stephengold:jolt-jni-Windows64:3.5.0:ReleaseSp")

    include implementation("fr.mrqsdf:BbModelReader:1.0-SNAPSHOT")
    include(implementation("com.miry:miry:1.0-SNAPSHOT") {
        exclude group: "org.lwjgl"
    })

    if (luauEnabled.get()) {
        include implementation("dev.hollowcube:luau:${luauVersion.get()}")
        for (String variant : ['linux-x64', 'macos-x64', 'macos-arm64']) {
            include runtimeOnly("dev.hollowcube:luau-natives-${variant}:${luauVersion.get()}")
        }
        include runtimeOnly("moud.vendored:luau-natives-windows-x64:1.0.0")
    }
}

loom {
    mixin {
        defaultRefmapName = "moud.refmap.json"
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(clientJavaVersion.get())
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = clientJavaVersion.get()
    if (luauEnabled.get()) {
        options.compilerArgs += ["--enable-preview"]
    }
}

afterEvaluate {
    def resolveRenderDocExecutable = {
        def override = providers.environmentVariable("RENDERDOC_CMD").orNull
        if (override != null && !override.isBlank()) {
            return file(override.trim())
        }

        def osName = System.getProperty("os.name", "").toLowerCase(Locale.ROOT)
        def candidates = []
        if (osName.contains("win")) {
            candidates.add(file("C:/Program Files/RenderDoc/renderdoccmd.exe"))
            candidates.add(file("C:/Program Files/RenderDoc/qrenderdoc.exe"))
        } else if (osName.contains("mac")) {
            candidates.add(file("/Applications/RenderDoc.app/Contents/MacOS/renderdoccmd"))
            candidates.add(file("/Applications/RenderDoc.app/Contents/MacOS/qrenderdoc"))
            candidates.add(file("/usr/local/bin/renderdoccmd"))
        } else {
            candidates.add(file("/usr/bin/renderdoccmd"))
            candidates.add(file("/usr/local/bin/renderdoccmd"))
            candidates.add(file("/snap/bin/renderdoccmd"))
        }

        def resolved = candidates.find { it.exists() }
        return resolved
    }

    def withoutExtractRenderDoc = { dependencies ->
        dependencies.findAll { dep ->
            if (dep == null) {
                return false
            }

            if (dep instanceof CharSequence) {
                return dep.toString() != "extractRenderDoc"
            }

            def name = dep.hasProperty("name") ? dep.name : null
            return name != "extractRenderDoc"
        }
    }

    def renderDocExecutable = resolveRenderDocExecutable()

    if (renderDocExecutable != null) {
        tasks.withType(RenderDocRunTask).configureEach { task ->
            task.getRenderDocExecutable().set(renderDocExecutable)
            task.setDependsOn(withoutExtractRenderDoc(task.getDependsOn()))
        }

        tasks.withType(RenderDocRunUITask).configureEach { task ->
            task.getRenderDocExecutable().set(renderDocExecutable)
        }
    }
}

tasks.register('generateLuauClientTypes', JavaExec) {
    group = 'build'
    description = 'Regenerate core/src/main/resources/types/moud-client.d.luau from @LuauExport classes in client-fabric.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.moud.client.fabric.scripting.types.ClientLuauTypesMain'
    args = [rootProject.projectDir.toPath().resolve('core/src/main/resources/types/moud-client.d.luau').toString()]
}

