plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = 'moud'
}

def siblingJar = { String dir, String name, String version, String property ->
    def f = file(findProperty(property) ?: "${rootDir}/../${dir}/build/libs/${name}-${version}.jar")
    if (!f.exists()) {
        throw new GradleException("moud needs ${name} at ${f}. build the ${dir} repo "
                + "next to this one, or pass -P${property}=/path/to/${name}.jar")
    }
    return f
}

def devRun = file(findProperty('runDir') ?: "${rootDir}/../Moud-run")
def devRunRelative = projectDir.toPath().relativize(devRun.toPath()).toString()

loom {
    accessWidenerPath = file('src/main/resources/moud.accesswidener')

    runs {
        client {
            runDir devRunRelative
            vmArg '--enable-native-access=ALL-UNNAMED'
            vmArg '-XX:+EnableDynamicAgentLoading'
            vmArg '-Djdk.attach.allowAttachSelf=true'
            if (findProperty('place')) vmArg "-Dmoud.place=${file(findProperty('place')).absolutePath}"
            if (findProperty('join')) programArgs '--quickPlayMultiplayer', findProperty('join')
            if (findProperty('player')) programArgs '--username', findProperty('player')
        }
        server {
            runDir devRunRelative
            vmArg '--enable-native-access=ALL-UNNAMED'
            vmArg '-XX:+EnableDynamicAgentLoading'
            vmArg '-Djdk.attach.allowAttachSelf=true'
            if (findProperty('place')) vmArg "-Dmoud.place=${file(findProperty('place')).absolutePath}"
            programArgs '--nogui'
        }
    }
}

def amnetic = siblingJar('Amnetic', 'amnetic', project.amnetic_version, 'amneticJar')
def bkun = siblingJar('Bkun', 'bkun', project.bkun_version, 'bkunJar')
def resona = siblingJar('Resona', 'resona', project.resona_version, 'resonaJar')
def polar = siblingJar('polar', 'polar', project.polar_version, 'polarJar')
def box3d = siblingJar('box3d-java', 'box3d-java', project.box3d_version, 'box3dJar')

def box3dNatives = file(findProperty('box3dNatives') ?: "${rootDir}/../box3d-java/natives")

def nativePlatform = {
    def os = System.getProperty('os.name').toLowerCase()
    def arch = System.getProperty('os.arch').toLowerCase()
    def bit = arch.contains('aarch64') || arch.contains('arm64') ? 'arm64' : 'x64'
    if (os.contains('win')) return "windows-${bit}"
    if (os.contains('mac')) return "macos-${bit}"
    return "linux-${bit}"
}

def nativePathVariable = {
    def os = System.getProperty('os.name').toLowerCase()
    if (os.contains('win')) return 'PATH'
    if (os.contains('mac')) return 'DYLD_LIBRARY_PATH'
    return 'LD_LIBRARY_PATH'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly files(amnetic, bkun, resona)
    runtimeOnly files(amnetic, bkun, resona)
    testCompileOnly files(amnetic, bkun, resona)
    testRuntimeOnly files(amnetic, bkun, resona)

    compileOnly files(box3d)

    compileOnly "foundry.imguimc:imguimc-fabric-26.1:${project.imguimc_version}"
    localRuntime "foundry.imguimc:imguimc-fabric-26.1:${project.imguimc_version}"

    implementation "org.xerial:sqlite-jdbc:3.46.1.3"
    include "org.xerial:sqlite-jdbc:3.46.1.3"

    implementation files(polar)

    implementation project(':core')
    implementation project(':script')
    implementation project(':net')
    localRuntime project(':addons:revo')
    localRuntime project(':addons:java')
    include project(':core')
    include project(':script')
    include project(':net')
    include 'org.recast4j:recast:1.5.12'
    include 'org.recast4j:detour:1.5.12'
    include 'net.bytebuddy:byte-buddy:1.18.13'
    include 'net.bytebuddy:byte-buddy-agent:1.18.13'
}

processResources {
    if (box3dNatives.exists()) {
        from(box3dNatives) { into 'natives' }
    } else {
        logger.warn("moud: no box3d natives at ${box3dNatives}, sub level collision will fail to load")
    }
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
                'minecraft_version': project.minecraft_version,
                'loader_version': project.loader_version
    }
}

jar {
    from(zipTree(polar)) {
        exclude 'META-INF/**'
    }
}

tasks.matching { it.name.startsWith('run') }.configureEach {
    def dir = new File(box3dNatives, nativePlatform())
    if (dir.exists()) {
        def variable = nativePathVariable()
        def existing = System.getenv(variable)
        environment variable, existing ? "${dir}${File.pathSeparator}${existing}" : dir.toString()
    }
}
