dependencies {
    implementation project(':core')
    api "dev.hollowcube:luau:${project.luau_version}"

    // one per platform we ship on, the loader picks the one it finds on the classpath
    runtimeOnly "dev.hollowcube:luau-natives-linux-x64:${project.luau_version}"
    runtimeOnly "dev.hollowcube:luau-natives-windows-x64:${project.luau_version}"
    runtimeOnly "dev.hollowcube:luau-natives-macos-x64:${project.luau_version}"
    runtimeOnly "dev.hollowcube:luau-natives-macos-arm64:${project.luau_version}"
}

// luau reaches its native library through the ffm api, which is restricted by default
tasks.withType(Test).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
